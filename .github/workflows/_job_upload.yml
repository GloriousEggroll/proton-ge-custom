name: _job_upload

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      name:
        required: true
        type: string

jobs:
  upload:
    name: Upload ${{ inputs.name }}

    runs-on: ubuntu-latest

    steps:
      - name: Verify release exists
        run: |
          gh release view "${{ inputs.version }}" \
            --repo "${{ github.server_url }}/${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download ${{ inputs.name }}.tar.gz artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.name }}.tar.gz

      - name: Download ${{ inputs.name }}.sha512sum artifact
        uses: actions/download-artifact@v6
        with:
          name: ${{ inputs.name }}.sha512sum

      # Never replace a build that is already on the release, e.g. one uploaded
      # by hand. The tarball and its checksum go together, checked once in one
      # job: if either is there, upload neither, so the checksum always matches
      # the tarball.
      - name: Upload ${{ inputs.name }} to release
        shell: bash
        run: |
          repo="${{ github.server_url }}/${{ github.repository }}"
          if gh release view "${{ inputs.version }}" --repo "$repo" --json assets --jq '.assets[].name' \
              | grep -Fxq -e "${{ inputs.name }}.tar.gz" -e "${{ inputs.name }}.sha512sum"; then
            echo "::notice::A ${{ inputs.name }} build is already on release ${{ inputs.version }}, not uploading."
          else
            gh release upload "${{ inputs.version }}" \
              "${{ inputs.name }}.tar.gz" "${{ inputs.name }}.sha512sum" --repo "$repo"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
